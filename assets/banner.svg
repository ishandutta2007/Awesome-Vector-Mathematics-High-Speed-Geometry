<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb199" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9e9" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes spinMesh {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vectorDash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .mesh-spin {
      transform-origin: 980px 180px;
      animation: spinMesh 60s linear infinite;
    }
    .vector-flow {
      stroke-dasharray: 8 12;
      animation: vectorDash 6s linear infinite;
    }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill-float-3 { animation: floatPill 4.5s ease-in-out 2s infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Light Halos -->
  <circle cx="150" cy="180" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="180" r="240" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="80" r="180" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Geometric Mesh Lines in Background Right -->
  <g class="mesh-spin" opacity="0.55">
    <!-- Polyhedral / Delaunay Wireframe -->
    <polygon points="980,60 1100,140 1050,280 910,280 860,140" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" />
    <polygon points="980,100 1060,160 1020,250 940,250 900,160" fill="none" stroke="url(#purpleGrad)" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="980" y1="60" x2="1020" y2="250" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="1100" y1="140" x2="940" y2="250" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="1050" y1="280" x2="900" y2="160" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
    <line x1="910" y1="280" x2="980" y2="100" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <line x1="860" y1="140" x2="1060" y2="160" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="980" cy="60" r="4" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="1100" cy="140" r="4" fill="#7000ff" filter="url(#glow)" />
    <circle cx="1050" cy="280" r="4" fill="#f355da" filter="url(#glow)" />
    <circle cx="910" cy="280" r="4" fill="#00f5a0" filter="url(#glow)" />
    <circle cx="860" cy="140" r="4" fill="#ffb199" filter="url(#glow)" />
  </g>

  <!-- Animated Vector Direction Rays -->
  <g opacity="0.4">
    <path d="M 50 310 Q 250 200 450 310" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" class="vector-flow" />
    <path d="M 300 30 Q 600 120 900 30" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" class="vector-flow" />
    <path d="M 750 330 L 1150 270" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.2" class="vector-flow" />
  </g>

  <!-- Foreground Content Block -->
  <!-- Category Overline Badge -->
  <g transform="translate(80, 56)">
    <rect width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#00f5a0" filter="url(#glow)" />
    <text x="30" y="20" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED HIGH-SPEED ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="142" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Vector Mathematics &amp;</text>
  <text x="80" y="196" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">High-Speed Geometry 📐</text>

  <!-- Subtitle Paragraph -->
  <text x="80" y="238" fill="#94a3b8" font-size="16" font-weight="400">
    SIMD/GPU Vector Engines • Computational Geometry Kernels • Linear Algebra • CAS
  </text>

  <!-- Feature Floating Badges / Pills -->
  <g transform="translate(80, 274)" class="pill-float-1">
    <rect width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <text x="14" y="22" fill="#38bdf8" font-size="13" font-weight="700">🚀 SIMD &amp; GPU Math</text>
  </g>

  <g transform="translate(240, 274)" class="pill-float-2">
    <rect width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1" />
    <text x="14" y="22" fill="#c7d2fe" font-size="13" font-weight="700">📐 Robust Geometry</text>
  </g>

  <g transform="translate(423, 274)" class="pill-float-3">
    <rect width="176" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1" />
    <text x="14" y="22" fill="#e9d5ff" font-size="13" font-weight="700">🌌 Matrix &amp; 3D Meshes</text>
  </g>

  <g transform="translate(614, 274)" class="pill-float-1">
    <rect width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1" />
    <text x="14" y="22" fill="#6ee7b7" font-size="13" font-weight="700">⭐ Open Ecosystem</text>
  </g>

  <!-- Subtle Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
